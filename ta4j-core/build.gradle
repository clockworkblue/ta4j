plugins {
    id 'eclipse'
    id 'java-library'
}

repositories {
    mavenCentral()
}

group = 'org.ta4j'
version = '0.16-SNAPSHOT'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

test {
    onlyIf {
        project.hasProperty("ta4jTests")
    }
}

dependencies {
    api 'org.slf4j:slf4j-api:2.0.7'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation ('org.apache.poi:poi:5.2.3') {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    }
    testImplementation 'org.apache.logging.log4j:log4j-core:2.23.1'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1'
    testImplementation 'com.opencsv:opencsv:5.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.junit.vintage:junit-vintage-engine:5.13.4'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

description = 'Ta4j Core'
